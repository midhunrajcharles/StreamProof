<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline · StreamProof</title>
  <style>
    :root { color-scheme: light dark; --bg: #f5f5f7; --card: #fff; --label: #1d1d1f; --label2: #6e6e73; --ink: #1d1d1f; --on-ink: #fff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --label: #f5f5f7; --label2: #a1a1a6; --ink: #f5f5f7; --on-ink: #000; } }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--label);
      font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
    main { max-width: 420px; background: var(--card); border-radius: 18px; padding: 28px; display: grid; gap: 12px; }
    h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
    p { margin: 0; color: var(--label2); }
    a { justify-self: start; margin-top: 6px; display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 999px;
      background: var(--ink); color: var(--on-ink); text-decoration: none; font-weight: 500; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>This page hasn't been saved on this device yet. Reports you make while offline are kept on the device and sent when you're back online.</p>
    <a href="/report">Make a report</a>
  </main>
</body>
</html>
